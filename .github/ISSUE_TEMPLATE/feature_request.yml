name: Feature request
description: Suggest an improvement or support for a new diagram type or input format.
title: "[feature] <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: For a diagram type, describe how the Figma result should be structured (frames, Auto Layout, names).
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input
      description: Mermaid, DBML or SQL code that shows the case.
      render: text
