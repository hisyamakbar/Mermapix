# The web app moved to https://mermapix.hisyamakbar.com (Cloudflare, headers in public/_headers).
# Until the Netlify site is deleted, Netlify only sends the old mermapix.netlify.app address there.
# Cloudflare ignores this file.

[build]
  command = "pnpm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "https://mermapix.hisyamakbar.com/:splat"
  status = 301
  force = true
